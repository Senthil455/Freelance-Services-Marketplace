<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillForge - Freelance marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <span class="logo">SkillForge</span>
  <ul>
    <li><a href="#">Browse</a></li>
    <li><a href="#">Sell</a></li>
    <li><a href="#">Sign in</a></li>
  </ul>
</nav>

<header class="hero">
  <h1>Find the right freelancer for your project</h1>
  <p>Design, development, writing and more.</p>
  <div class="search-box">
    <input id="search" type="text" placeholder="search gigs... (press / to focus)">
  </div>
</header>

<section class="section">
  <h2>Categories</h2>
  <div id="categories"></div>
</section>

<section class="section">
  <h2>Popular gigs</h2>
  <p class="count" id="count"></p>
  <div class="sort-row">
    <label for="sort">Sort by</label>
    <select id="sort">
      <option value="recommended">Recommended</option>
      <option value="price-low">Price: low to high</option>
      <option value="price-high">Price: high to low</option>
      <option value="rating">Rating</option>
    </select>
  </div>
  <div class="grid" id="gigs"></div>
</section>

<footer>
  <p>&copy; 2025 SkillForge</p>
</footer>

<script src="scripts/data.js"></script>
<script src="scripts/app.js"></script>


</body>
</html>
