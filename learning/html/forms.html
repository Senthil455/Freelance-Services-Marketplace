<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forms</title>
</head>
<body>
<h1>Forms practice</h1>
<form>
  <label for="name">Name</label>
  <input type="text" id="name" name="name">
  <br><br>
  <label for="msg">Message</label>
  <textarea id="msg" name="msg" rows="4" cols="40"></textarea>
  <br><br>
  <button type="submit">Send</button>
</form>
</body>
</html>
