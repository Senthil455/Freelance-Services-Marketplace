<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML basics</title>
</head>
<style>
h1 { color: navy; }
</style>
<body>
<h1>My first heading</h1>
<p>This is a paragraph. I am writing my first HTML page.</p>
<h2>A smaller heading</h2>
<p>Second paragraph with some words in it.</p>
<hr>
<h3>Notes</h3>
<p>Headings go from h1 down to h6. The browser decides spacing.</p>
</body>
</html>
