<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
</head>
<body>
<input type="number" id="a" placeholder="a">
<select id="op">
  <option value="+">+</option>
  <option value="-">-</option>
  <option value="*">*</option>
  <option value="/">/</option>
</select>
<input type="number" id="b" placeholder="b">
<button id="calc">Calculate</button>
<p id="result">-</p>
<script src="calc.js"></script>

</body>
</html>
